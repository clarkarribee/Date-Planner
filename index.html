<style>

.pol{margin:0;background:#fff;color:#4a2030;padding:8px 8px 10px;border-radius:6px;box-shadow:0 6px 16px rgba(90,42,60,.25);transform:rotate(-1deg)}

.polf{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.polf small{color:#8a5a6c}
.polf .chip{min-height:32px;padding:0 10px;font-size:.75rem;background:#fff;color:#4a2030}
.mhero{margin-bottom:14px}
.mlist{display:grid;gap:10px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 14px rgba(214,87,138,.12);font:inherit;cursor:pointer;transition:transform .2s,box-shadow .2s;opacity:0;animation:fadein .6s .1s forwards}
.mi:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(214,87,138,.22)}
.mi:active{transform:scale(.98)}
.mi.hist{cursor:default}.mi.hist:hover,.mi.hist:active{transform:none}
.mic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:linear-gradient(135deg,#ffe58a,#ffc928)}
.mt{flex:1;min-width:0}.mt b{display:block}.mt small{display:block;color:var(--muted);overflow-wrap:anywhere}
.mar{font-size:1.6rem;color:var(--pink2)}
.mh{margin:22px 0 8px;text-align:center}
.intro{position:relative;overflow:hidden}
.fadeup{opacity:0;animation:up .9s ease-out forwards}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{to{opacity:1}}
.bqt{display:block;width:min(78%,300px);height:auto;margin:6px auto}
.stem{fill:none;stroke:#5aa03c;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1.2s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.fl{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-90deg);animation:bloom 1s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes bloom{to{transform:scale(1) rotate(0)}}
.lf{opacity:0;animation:fadein .6s .8s forwards}
.pap{opacity:0;animation:fadein .6s forwards}
.hrt{position:absolute;bottom:-20px;pointer-events:none;opacity:0;animation:floatup linear infinite}
@keyframes floatup{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-560px) rotate(25deg);opacity:0}}
.env{display:block;margin:12px auto 0;background:none;border:0;padding:6px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s;filter:drop-shadow(0 6px 10px rgba(214,87,138,.4))}
.env.on{opacity:1;pointer-events:auto;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.remind{opacity:0;pointer-events:none;transition:opacity .8s;font-weight:800;color:var(--pink2);margin:6px 0 0}
.remind.on{opacity:1;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.paper{margin-top:16px;padding:20px 18px;border-radius:16px;text-align:left;background:var(--soft);border:2px solid var(--line);line-height:1.6;animation:up .9s ease-out both}
.paper p{margin:.6em 0}
@media(prefers-reduced-motion:reduce){.intro *{animation-delay:0s!important}.env,.remind{animation:none!important}.hrt{display:none}}
.hide{display:none!important}
@media(max-width:360px){.wrap{padding-top:12px}.card{padding:18px 12px;border-radius:20px}.btn{padding:0 16px;font-size:.95rem}.sf{width:90px;height:90px}.bub{max-width:70%}nav button{padding:0 12px}}@media(min-width:768px){.wrap{max-width:640px;padding-top:28px}.card{padding:30px 28px}.sf{width:130px;height:130px}}@media(max-height:480px) and (orientation:landscape){.sf{width:64px;height:64px}.btns{min-height:70px}}@media(hover:hover){.btn:hover,nav button:hover,.chip:hover{filter:brightness(1.06)}}
@media(prefers-reduced-motion:reduce){#petals,.sf,.bq i{display:none}*{animation-duration:.01s!important;transition-duration:.01s!important}.fx{display:none}}
html,body{overscroll-behavior-y:none}
.partner #m1,.partner #m2,.partner #m3,.partner #inew,.partner #nav [data-v=plan],.partner #nav [data-v=msgs],.partner #nav [data-v=intro],.partner .acts [data-a=copy],.partner .acts [data-a=ok],.partner .acts [data-a=edit],.partner .acts [data-a=del],.partner [data-del]{display:none!important}.partner #mlt{pointer-events:none}
</style></head>
<body>
<div id="petals" aria-hidden="true"></div>
<div class="wrap">
<nav id="nav" aria-label="Pages">
<button data-v="menu">🏠 Menu</button><button data-v="inv">💌 Invitations</button><button data-v="plan">🌸 Planner</button>
</nav>

<main>
<section id="menu" class="hide"></section>
<section id="inv" class="hide"></section>
<section id="mem" class="hide"></section>
<section id="intro" class="hide"></section>
<section id="home"></section>

<section id="yes" class="hide"></section>

<section id="plan" class="hide">
<div class="card planner">
<h2 class="script" style="text-align:center">Plan a cute date 🌸</h2>
<label for="msg">Personal message (optional)</label><textarea id="msg" placeholder="Write something sweet…"></textarea>
<label id="l1">Date idea</label><div class="opts" id="food" role="group" aria-labelledby="l1"></div>
<input id="foodC" class="hide" placeholder="Describe your date idea" aria-label="Custom date idea" style="margin-top:8px">
<label id="l2">Outfit suggestion</label><div class="opts" id="outf" role="group" aria-labelledby="l2"></div>
<input id="outC" class="hide" placeholder="Describe the outfit" aria-label="Custom outfit" style="margin-top:8px">
<label id="l3">Outfit color <span id="cn" class="hint"></span></label><div class="opts" id="cols" role="group" aria-labelledby="l3"></div>
<div class="opts" style="margin-top:8px;align-items:center"><input type="color" id="cpick" value="#f48fb1" aria-label="Custom color" style="width:56px;padding:2px"><input id="cname" placeholder="Custom color name (e.g. peach)" aria-label="Custom color name" style="flex:1;min-width:150px"></div>
<label id="l4">Date</label><div class="cal" id="cal" role="group" aria-labelledby="l4"></div>
<label for="time">Time</label><input type="time" id="time">
<label for="place">Location / meeting place</label><input id="place" placeholder="Where should we meet?">
<label for="note">Note or special instruction (optional)</label><textarea id="note"></textarea>
<label id="l5">Love letter she opens first 💌</label><div class="opts" id="ltm" role="group" aria-labelledby="l5"></div>
<textarea id="ltc" class="hide" placeholder="Write your own letter…" aria-label="Your own letter" style="margin-top:8px;min-height:140px"></textarea>
<p class="hint" id="lth" style="margin:6px 0 0"></p>
<div class="btns" style="min-height:0;margin-top:18px">
<button class="btn" id="mk">🔗 Create share link</button><button class="btn alt" id="cpi">Copy invitation</button><button class="btn alt" id="pvs">👀 Preview the surprise</button><button class="btn alt" id="nw">New invitation</button>
</div>
<p class="hint" id="shareinfo" style="text-align:center"></p>
<h2 class="script pv" style="text-align:center">Live preview</h2>
<div id="pv"></div>
</div>
</section>

<section id="msgs" class="hide">
<div class="card">
<h2 class="script">A bouquet with every message</h2>
<p class="hint">Local demo: messages stay on this device only and are not delivered to anyone.</p>
<div class="chat" id="chat" aria-live="polite"></div>
<form class="send" id="sf"><input id="mi" placeholder="Type a sweet message…" aria-label="Message" autocomplete="off"><button class="btn" type="submit">Send</button></form>
</div>
</section>
</main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const FOODS=[['🍣','Sushi date'],['☕','Coffee date'],['🥩','Samgyupsal date'],['🍝','Dinner date'],['🍰','Dessert date'],['🤭','Bahala na surprise'],['✏️','Custom']];
const OUTF=['Casual','Comfy outfit','Dress up a little','Matching outfits','Your choice','Custom'];
const COLS=[['Pink','#f7a6c1'],['White','#ffffff'],['Black','#222222'],['Yellow','#ffd43b'],['Blue','#7ab6f5'],['Brown','#8b5e3c'],['Lavender','#c3a8f0'],['Any color','conic-gradient(#f7a6c1,#ffd43b,#7ab6f5,#c3a8f0,#f7a6c1)']];
const EMPTY={food:'',foodC:'',outf:'',outC:'',col:'',msg:'',date:'',time:'',place:'',note:'',lt:'',ltC:'',li:''};
let P={...EMPTY},shared=false;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){if(k==='sd_hist'&&window.CL&&CL.on){CL.setHist(JSON.parse(v));return}try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
const SEP='\u001f';
function pack(p){const fi=FOODS.findIndex(x=>x[1]===p.food),oi=OUTF.indexOf(p.outf),ci=COLS.findIndex(x=>x[0]===p.col),cc=p.col&&ci<0?p.col:'';
const codes=(fi<0?'-':fi)+''+(oi<0?'-':oi)+(ci>=0?ci:(cc?'c':'-'))+(p.lt==='c'&&p.ltC?'c':(/^\d$/.test(String(p.li))?p.li:'-'));
return [codes,p.date.replace(/-/g,'').slice(2),p.time.replace(':',''),fi===6?p.foodC:'',oi===5?p.outC:'',cc,p.msg,p.place,p.note,p.lt==='c'?p.ltC:''].join(SEP).replace(/\u001f+$/,'')}
function unpack(s){const a=s.split(SEP),c=a[0]||'---',g=i=>a[i]||'',d=g(1),t=g(2);
const f=c[0]==='-'?'':(FOODS[+c[0]]||[])[1]||'',o=c[1]==='-'?'':OUTF[+c[1]]||'',col=c[2]==='c'?g(5):(c[2]==='-'?'':(COLS[+c[2]]||[])[0]||'');
return {...EMPTY,food:f,foodC:g(3),outf:o,outC:g(4),col,msg:g(6),place:g(7),note:g(8),date:d.length===6?'20'+d.slice(0,2)+'-'+d.slice(2,4)+'-'+d.slice(4):'',time:t.length===4?t.slice(0,2)+':'+t.slice(2):'',lt:c[3]==='c'?'c':'',ltC:c[3]==='c'?g(9):'',li:/^\d$/.test(c[3]||'')?c[3]:''}}

/* petals */
(function(){const b=$('#petals'),N=innerWidth<500?10:18;for(let i=0;i<N;i++){const e=document.createElement('i'),s=8+Math.random()*10;
if(i%6==0){e.className='f';e.textContent=['🌻','🌼'][i%2];e.style.fontSize=(12+Math.random()*8)+'px'}else{e.style.width=s+'px';e.style.height=s*1.4+'px'}
e.style.left=Math.random()*100+'%';e.style.setProperty('--dx',(Math.random()*120-60)+'px');e.style.setProperty('--r',(Math.random()*720-360)+'deg');
e.style.animationDuration=(9+Math.random()*10)+'s';e.style.animationDelay=(-Math.random()*18)+'s';b.appendChild(e)}})();

/* sunflower svg */
function sunflower(){let p='';for(let i=0;i<14;i++)p+=`<ellipse cx="50" cy="20" rx="8" ry="17" fill="#ffc928" stroke="#f0a500" stroke-width="1" transform="rotate(${i*360/14} 50 50)"/>`;
return `<svg class="sf" viewBox="0 0 100 100" role="img" aria-label="Sunflower">${p}${faceSrc()?`<circle cx="50" cy="50" r="26" fill="#7a4a2a"/><image href="${faceSrc()}" x="27" y="27" width="46" height="46"/><circle cx="50" cy="50" r="24" fill="none" stroke="#7a4a2a" stroke-width="2.5"/>`:`<circle cx="50" cy="50" r="15" fill="#7a4a2a"/><circle cx="50" cy="50" r="9" fill="#5a3418"/>`}</svg>`}

/* details */
function fmtD(d){if(!d)return'';const [y,m,x]=d.split('-');return new Date(y,m-1,x).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function fmtT(t){return t?new Date('1970-01-01T'+t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):''}
function rows(p){const f=p.food==='Custom'?p.foodC:p.food,fe=(FOODS.find(x=>x[1]===p.food)||[''])[0];

/* calendar */
let CM=null;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function renderCal(){const box=$('#cal'),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
if(!CM){const b=P.date?new Date(P.date+'T00:00'):today;CM=new Date(b.getFullYear(),b.getMonth(),1)}
const y=CM.getFullYear(),m=CM.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),canPrev=new Date(y,m,1)>new Date(today.getFullYear(),today.getMonth(),1);
let h=`<div class="calh"><button type="button" class="calnav" id="cp" aria-label="Previous month"${canPrev?'':' disabled'}>‹</button><strong class="script">${CM.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</strong><button type="button" class="calnav" id="cx" aria-label="Next month">›</button></div><div class="calg">`;
['S','M','T','W','T','F','S'].forEach(d=>h+=`<span class="cwd" aria-hidden="true">${d}</span>`);
for(let i=0;i<first;i++)h+='<span></span>';
for(let d=1;d<=days;d++){const dt=new Date(y,m,d),v=iso(dt);
h+=`<button type="button" class="cd${v===P.date?' sel':''}${dt.getTime()===today.getTime()?' td':''}" data-d="${v}" aria-pressed="${v===P.date}" aria-label="${dt.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}"${dt<today?' disabled':''}>${d}</button>`}
h+=`</div><div class="opts calq"><button type="button" class="chip" data-q="0">Today</button><button type="button" class="chip" data-q="1">Tomorrow</button><button type="button" class="chip" data-q="sat">This Saturday</button></div><p class="hint" style="text-align:center;margin:8px 0 0">${P.date?'Picked: '+esc(fmtD(P.date)):'Tap a day to pick the date'}</p>`;
box.innerHTML=h}
$('#cal').onclick=e=>{const t=e.target.closest('button');if(!t||t.disabled)return;
if(t.id==='cp'){CM=new Date(CM.getFullYear(),CM.getMonth()-1,1);renderCal();return}
if(t.id==='cx'){CM=new Date(CM.getFullYear(),CM.getMonth()+1,1);renderCal();return}
if(t.dataset.d){P.date=P.date===t.dataset.d?'':t.dataset.d;save();renderPlan();return}
if(t.dataset.q){const n0=new Date(),d=new Date(n0.getFullYear(),n0.getMonth(),n0.getDate());
if(t.dataset.q==='sat')d.setDate(d.getDate()+(6-d.getDay()+7)%7);else d.setDate(d.getDate()+(+t.dataset.q));
P.date=iso(d);CM=null;save();renderPlan()}};

/* messages */
let M=[];try{M=JSON.parse(store.get('sd_msgs')||'[]')}catch(e){}
function renderMsgs(){const c=$('#chat');c.innerHTML=M.length?'':'<p class="empty">No messages yet 🌻<br>Send one and a little bouquet comes with it.</p>';
M.forEach((m,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div class="bub">${esc(m.t)}<small>${new Date(m.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} · local demo</small></div><span class="bq" aria-hidden="true">💐<i>🌻</i><i>✿</i></span>`;c.appendChild(r)});c.lastElementChild&&c.lastElementChild.scrollIntoView({block:'nearest'})}
$('#sf').onsubmit=e=>{e.preventDefault();const v=$('#mi').value.trim();if(!v)return;M.push({t:v,at:Date.now()});store.set('sd_msgs',JSON.stringify(M.slice(-100)));$('#mi').value='';renderMsgs()};

/* her face in the sunflower */
const FACE_URL='her.png';   // her photo, cropped into a circle (file in this folder)
function faceSrc(){return store.get('sd_face')||FACE_URL||''}
function faceCrop(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const S=220,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.beginPath();x.arc(S/2,S/2,S/2,0,6.2832);x.clip();const k=Math.max(S/im.width,S/im.height),w=im.width*k,hh=im.height*k;x.drawImage(im,(S-w)/2,hh>S?-(hh-S)*.3:(S-hh)/2,w,hh);res(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(file)})}
function faceCard(){const old=$('#facec');if(old)old.remove();if(/^#(e|d)./.test(location.hash))return;
const has=!!store.get('sd_face'),d=document.createElement('div');d.id='facec';d.className='card';d.style.marginTop='14px';
d.innerHTML=`<h2 class="script">Photo in the sunflower 🌻</h2><p class="hint">Only one photo at a time: a new one replaces the old one. Saved on this device only.</p><div class="btns" style="min-height:0"><button type="button" class="btn" id="fpick">📷 ${has?'Change':'Choose'} photo</button>${has?'<button type="button" class="btn alt" id="frem">'+(FACE_URL?'Use default':'Remove')+'</button>':''}</div><input type="file" id="fin" accept="image/*" class="hide">`;
$('#menu').appendChild(d);$('#fpick').onclick=()=>$('#fin').click();
const rm=$('#frem');if(rm)rm.onclick=()=>{try{localStorage.removeItem('sd_face')}catch(e){}renderMenu()};
$('#fin').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{localStorage.setItem('sd_face',await faceCrop(f));renderMenu();toast('Looking good 🌻')}catch(x){toast('Could not use that photo')}}}

/* install as app + offline */
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(!$('#menu').classList.contains('hide'))installCard()});
addEventListener('appinstalled',()=>{dip=null;const i=$('#inst');if(i)i.remove()});
function installCard(){const m=$('#menu');if($('#inst')||matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(!dip&&!ios)return;
const d=document.createElement('div');d.id='inst';d.className='card';d.style.marginTop='14px';
d.innerHTML=dip?'<h2 class="script">Install as an app 📲</h2><p class="hint">Add Date Planner to your home screen.</p><div class="btns" style="min-height:0"><button type="button" class="btn" id="instb">Install</button></div>':'<h2 class="script">Install as an app 📲</h2><p class="hint">Tap the Share button, then “Add to Home Screen”.</p>';
m.appendChild(d);const b=$('#instb');if(b)b.onclick=async()=>{dip.prompt();try{await dip.userChoice}catch(e){}dip=null;d.remove()}}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){const had=!!navigator.serviceWorker.controller;let rl=false;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}))}

/* init */
(function(){const h=location.hash.slice(1);
addEventListener('hashchange',()=>location.reload());
if(h==='demo'){const pick=[{food:'Sushi date',outf:'Dress up a little',col:'Pink',msg:'I saw this and thought of you. Come with me?',place:'Our favorite sushi place',time:'18:30',note:'Come hungry! 🍣'},{food:'Coffee date',outf:'Comfy outfit',col:'Yellow',msg:'Just us, a warm drink, and a long chat.',place:'The cozy café by the park',time:'15:00',note:'My treat ☕'},{food:'Samgyupsal date',outf:'Casual',col:'Lavender',msg:'I have a craving… and I want you there.',place:'Samgyup place near the mall',time:'19:00',note:'Bring your appetite 🥩'}][Math.floor(Math.random()*3)];
const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7||7));P={...EMPTY,...pick,date:iso(d),li:String(Math.floor(Math.random()*LETTERS.length))};shared=true;$('#nav').classList.add('hide');show('intro');return}
if(h[0]==='e'&&h.length>2){try{P=unpack(b64d(h.slice(1)));shared=true;$('#nav').classList.add('hide');show('intro');return}catch(e){}}
if(h[0]==='d'&&h.length>3){try{P={...EMPTY,...dec(h.slice(1))};shared=true;$('#nav').classList.add('hide');show('intro');return}catch(e){}}
try{P={...EMPTY,...JSON.parse(store.get('sd_draft')||'{}')}}catch(e){}
show('menu')})();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{initializeFirestore,persistentLocalCache,collection,doc,setDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const ADMIN="4jQbiK8FICbtqmm2CKJvynRVEX02",PARTNER="crpDIgIRRjTTbvdOnOf4KjkoUj73";
const app=initializeApp({apiKey:"AIzaSyBM7lm1UpzZiwDEklpdsCMXnODcB1DYC7o",authDomain:"dates-planner.firebaseapp.com",projectId:"dates-planner",messagingSenderId:"275993488366",appId:"1:275993488366:web:3c1c6d4a0ee016cae8fcff"});
const auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});
const CL=window.CL={on:false,role:"",uid:"",inv:{},ml:{},ph:{},un:[]};
const wr=p=>p.catch(e=>window.toast&&toast("Could not save ("+(e.code||"error")+")"));
const refresh=()=>{const a=document.activeElement;if(a&&a.closest&&a.closest("#mem")&&/TEXTAREA|INPUT/.test(a.tagName))return;
const vis=v=>!document.getElementById(v).classList.contains("hide");
if(vis("menu"))renderMenu();else if(vis("inv"))renderInv();else if(vis("mem"))renderMem()};
CL.hist=()=>Object.values(CL.inv).map(x=>({...x})).sort((a,b)=>b.at-a.at);
CL.mget=()=>{const m={};for(const id in CL.inv)m[id]={items:[]};for(const id in CL.ml)(m[id]=m[id]||{items:[]}).letter=CL.ml[id];
Object.values(CL.ph).sort((a,b)=>a.at-b.at).forEach(p=>{(m[p.inv]=m[p.inv]||{items:[]}).items.push({id:p.id,img:p.img,cap:p.cap||"",at:p.at})});return m};
CL.setHist=a=>{const ids=new Set(a.map(x=>String(x.at)));
a.forEach(x=>{const id=String(x.at),n={t:x.t||"",d:x.d||"",l:x.l||"",ok:!!x.ok,at:x.at};
if(JSON.stringify(CL.inv[id])!==JSON.stringify(n)){CL.inv[id]=n;wr(setDoc(doc(db,"inv",id),n))}});
for(const id in CL.inv)if(!ids.has(id)){delete CL.inv[id];wr(deleteDoc(doc(db,"inv",id)))}};
CL.setMem=all=>{const seen=new Set();
for(const id in all){const o=all[id];
if(o.letter!==undefined&&o.letter!==CL.ml[id]){CL.ml[id]=o.letter;wr(setDoc(doc(db,"mem",id),{letter:o.letter}))}
(o.items||[]).forEach(i=>{seen.add(i.id);const p=CL.ph[i.id];
if(!p){const n={inv:id,img:i.img,cap:i.cap||"",at:i.at,by:CL.uid};CL.ph[i.id]={id:i.id,...n};wr(setDoc(doc(db,"ph",i.id),n))}
else if((i.cap||"")!==(p.cap||"")){p.cap=i.cap||"";wr(setDoc(doc(db,"ph",i.id),{cap:p.cap},{merge:true}))}})}
for(const pid in CL.ph)if(!seen.has(pid)){delete CL.ph[pid];wr(deleteDoc(doc(db,"ph",pid)))}
for(const id in CL.ml)if(!(id in all)){delete CL.ml[id];wr(deleteDoc(doc(db,"mem",id)))}};
CL.migrate=()=>{let h=[],m={};try{h=JSON.parse(localStorage.getItem("sd_hist")||"[]");m=JSON.parse(localStorage.getItem("sd_mem")||"{}")}catch(e){}
const H=CL.hist();h.forEach(x=>{if(!CL.inv[String(x.at)])H.push(x)});CL.setHist(H);
const all=CL.mget();for(const id in m){const o=all[id]=all[id]||{items:[]};
if(m[id].letter!==undefined&&o.letter===undefined)o.letter=m[id].letter;
(m[id].items||[]).forEach(i=>{if(!o.items.some(j=>j.id===i.id))o.items.push(i)})}
CL.setMem(all);try{localStorage.setItem("sd_mig","1")}catch(e){}refresh();toast("Uploaded 🌻")};
const sub=()=>{const er=e=>window.toast&&toast("Sync error ("+(e.code||"?")+")");
CL.un=[onSnapshot(collection(db,"inv"),s=>{CL.inv={};s.forEach(d=>CL.inv[d.id]=d.data());refresh()},er),
onSnapshot(collection(db,"mem"),s=>{CL.ml={};s.forEach(d=>CL.ml[d.id]=d.data().letter);refresh()},er),
onSnapshot(collection(db,"ph"),s=>{CL.ph={};s.forEach(d=>CL.ph[d.id]={id:d.id,...d.data()});refresh()},er)]};
onAuthStateChanged(auth,u=>{CL.un.forEach(f=>f());CL.un=[];
if(u&&(u.uid===ADMIN||u.uid===PARTNER)){CL.uid=u.uid;CL.role=u.uid===ADMIN?"admin":"partner";CL.on=true;sub()}
else{CL.on=false;CL.role="";CL.inv={};CL.ml={};CL.ph={};if(u)signOut(auth)}
document.body.classList.toggle("partner",CL.role==="partner");
const v=document.getElementById("menu");if(v&&!v.classList.contains("hide"))renderMenu();else refresh()});
window.cloudUI=()=>{const m=document.getElementById("menu");if(!m)return;let h;
if(CL.on){let loc=0;try{loc=JSON.parse(localStorage.getItem("sd_hist")||"[]").length}catch(e){}
h='<p class="hint" style="margin:0 0 8px">☁️ Synced · '+CL.role+'</p>'+(CL.role==="admin"&&loc&&!localStorage.getItem("sd_mig")?'<button type="button" class="chip" id="cmig">⬆ Upload this phone\'s data</button> ':'')+'<button type="button" class="chip" id="cout">Sign out</button>'}
else h='<button type="button" class="chip" id="cin">☁️ Sign in to sync</button>';
m.insertAdjacentHTML("beforeend",'<div class="card" style="margin-top:14px">'+h+'</div>')};
document.getElementById("menu").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.id==="cout")signOut(auth);else if(b.id==="cmig")CL.migrate();
else if(b.id==="cin"){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#0008;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px";
d.innerHTML='<div class="card" style="max-width:340px;width:100%"><h2 class="script">Sign in 🌻</h2><input id="le" type="email" placeholder="Email" autocomplete="username" style="width:100%;margin:6px 0"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;margin:6px 0"><p class="hint" id="lm"></p><button type="button" class="btn" id="lg">Sign in</button> <button type="button" class="chip" id="lx">Cancel</button></div>';
document.body.appendChild(d);d.querySelector("#lx").onclick=()=>d.remove();
d.querySelector("#lg").onclick=async()=>{try{await signInWithEmailAndPassword(auth,d.querySelector("#le").value.trim(),d.querySelector("#lp").value);d.remove();toast("Signed in 🌻")}catch(x){d.querySelector("#lm").textContent="Wrong email or password"}}}});
</script>
